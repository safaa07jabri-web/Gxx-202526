<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Analyse des Étudiants</title>
  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
    }

    /* HEADER */
    header {
      background: linear-gradient(to right, #1e3a8a, #3b82f6);
      color: white;
      padding: 40px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
    }

    /* SECTIONS */
    section {
      padding: 30px;
      margin: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* BUTTONS */
    button {
      background: #3b82f6;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    tr:nth-child(even) {
      background-color: #f9fafb;
    }

    tr:hover {
      background-color: #e5e7eb;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 20px;
      background: #1e3a8a;
      color: white;
      margin-top: 20px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      section {
        margin: 10px;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Analyse des Étudiants</h1>
    <p>Plateforme intelligente pour analyser les performances académiques</p>
  </header>

  <!-- SECTION UPLOAD -->
  <section>
    <h2>📂 Charger un fichier</h2>
    <input type="file">
    <br><br>
    <button>Analyser</button>
  </section>

  <!-- SECTION RESULT -->
  <section>
    <h2>📊 Résultats</h2>

    <table>
      <tr>
        <th>Nom</th>
        <th>Note</th>
      </tr>
      <tr>
        <td>Ali</td>
        <td>15</td>
      </tr>
      <tr>
        <td>Sara</td>
        <td>17</td>
      </tr>
    </table>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Projet ESTK - Analyse des étudiants</p>
  </footer>

</body>
</html>
